Transform: "AWS::LanguageExtensions"
Parameters:
  VpcCidrBlock:
    Type: String
    Description: CIDR block for the VPC
  ClusterServiceCidrBlock:
    Type: String
    Description: CIDR block for the EKS cluster
  SubnetCidrBlockA:
    Type: String
    Description: CIDR block within the VPC for the first subnet the cluster will run in
  SubnetCidrBlockB:
    Type: String
    Description: CIDR block within the VPC for the second subnet the cluster will run in
  SubnetCidrBlockC:
    Type: String
    Description: CIDR block within the VPC for the third subnet the cluster will run in
  PublicSubnetCidrBlockA:
    Type: String
    Description: CIDR block within the VPC for the first public subnet for external LBs
  PublicSubnetCidrBlockB:
    Type: String
    Description: CIDR block within the VPC for the second public subnet for external LBs
  PublicSubnetCidrBlockC:
    Type: String
    Description: CIDR block within the VPC for the third public subnet for external LBs
  PublicAccessIpList:
    Type: CommaDelimitedList
    Description: List of public IPs allowed to access the cluster
  DomainName:
    Type: String
    Description: The domain name for the cluster
  OrganizationDomain:
    Type: String
    Description: The domain name of the organization which manages Google SSO
Resources:
  VdcGlobalConfigParameter:
    Type: "AWS::SecretsManager::Secret"
    Properties:
      Name: "global-config"
      SecretString:
        Fn::ToJsonString:
          cloud: "aws"
          batch_aws_regions: !Sub "[ \"${AWS::Region}\" ]"
          batch_logs_storage_uri: !Sub "s3://${VdcHailBatchBucket}"
          test_storage_uri: !Sub "s3://${VdcHailTestBucket}"
          query_storage_uri: !Sub "s3://${VdcHailQueryBucket}"
          default_namespace: "default"
          docker_root_image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/hail/ubuntu:24.04"
          domain: !Ref DomainName
          aws_region: !Ref AWS::Region
          docker_prefix: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/hail"
          dockerhub_prefix: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/dockerhubproxy"
          internal_gateway_target_group_arn: !Ref VdcInternalGatewayHttpTargetGroup
          gateway_http_target_group_arn: !Ref VdcGatewayHttpTargetGroup
          gateway_https_target_group_arn: !Ref VdcGatewayHttpsTargetGroup
          kubernetes_server_url: !GetAtt VdcCluster.Endpoint
          organization_domain: !Ref OrganizationDomain

  VdcNonpreemptibleNodeGroup:
    Type: "AWS::EKS::Nodegroup"
    DependsOn: VdcClusterNodeAccessEntry
    Properties:
      UpdateConfig:
        UpdateStrategy: "DEFAULT"
        MaxUnavailable: 1
      ScalingConfig:
        MinSize: 0
        DesiredSize: 2
        MaxSize: 200
      Labels:
        preemptible: "false"
      CapacityType: "ON_DEMAND"
      NodeRepairConfig:
        Enabled: true
      NodegroupName: "nonpreemptible-pool"
      NodeRole: !GetAtt VdcClusterNodegroupRole.Arn
      Subnets:
        - !Ref VdcSubnetA
        - !Ref VdcSubnetB
        - !Ref VdcSubnetC
      ClusterName: !Ref VdcCluster
      LaunchTemplate:
        Id: !Ref VdcNonpreemptibleNodeLaunchTemplate
        Version: !GetAtt VdcNonpreemptibleNodeLaunchTemplate.LatestVersionNumber
  VdcNonpreemptibleNodeLaunchTemplate:
    Type: "AWS::EC2::LaunchTemplate"
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              Iops: 3000
              VolumeSize: 30
              DeleteOnTermination: true
              Encrypted: true
        ImageId: "{{resolve:ssm:/aws/service/eks/optimized-ami/1.35/amazon-linux-2023/x86_64/standard/recommended/image_id}}"
        InstanceType: t3a.large
        UserData:
          Fn::Base64: !Sub |
            ---
            apiVersion: node.eks.aws/v1alpha1
            kind: NodeConfig
            spec:
              cluster:
                name: ${VdcCluster}
                apiServerEndpoint: ${VdcCluster.Endpoint}
                certificateAuthority: ${VdcCluster.CertificateAuthorityData}
                cidr: "${ClusterServiceCidrBlock}"
              kubelet:
                config:
                  maxPods: 110
      LaunchTemplateName: "nonpreemptible-pool-launch-template"
  VdcPreemptibleNodeGroup:
    Type: "AWS::EKS::Nodegroup"
    DependsOn: VdcClusterNodeAccessEntry
    Properties:
      UpdateConfig:
        UpdateStrategy: "DEFAULT"
        MaxUnavailable: 1
      ScalingConfig:
        MinSize: 0
        DesiredSize: 3
        MaxSize: 200
      Labels:
        preemptible: "true"
      Taints:
        - Value: "true"
          Effect: "NO_SCHEDULE"
          Key: "preemptible"
      CapacityType: "SPOT"
      NodeRepairConfig:
        Enabled: true
      NodegroupName: "preemptible-pool"
      NodeRole: !GetAtt VdcClusterNodegroupRole.Arn
      Subnets:
        - !Ref VdcSubnetA
        - !Ref VdcSubnetB
        - !Ref VdcSubnetC
      ClusterName: !Ref VdcCluster
      LaunchTemplate:
        Id: !Ref VdcPreemptibleNodeLaunchTemplate
        Version: !GetAtt VdcPreemptibleNodeLaunchTemplate.LatestVersionNumber
  VdcPreemptibleNodeLaunchTemplate:
    Type: "AWS::EC2::LaunchTemplate"
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              Iops: 3000
              VolumeSize: 30
              DeleteOnTermination: true
              Encrypted: true
        ImageId: "{{resolve:ssm:/aws/service/eks/optimized-ami/1.35/amazon-linux-2023/x86_64/standard/recommended/image_id}}"
        InstanceType: t3a.large
        UserData:
          Fn::Base64: !Sub |
            ---
            apiVersion: node.eks.aws/v1alpha1
            kind: NodeConfig
            spec:
              cluster:
                name: ${VdcCluster}
                apiServerEndpoint: ${VdcCluster.Endpoint}
                certificateAuthority: ${VdcCluster.CertificateAuthorityData}
                cidr: ${ClusterServiceCidrBlock}
              kubelet:
                config:
                  maxPods: 110
      LaunchTemplateName: "preemptible-pool-launch-template"

  VdcClusterRole:
    Type: "AWS::IAM::Role"
    Properties:
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AmazonEKSClusterPolicy"
        - "arn:aws:iam::aws:policy/AmazonEKSNetworkingPolicy"
        - "arn:aws:iam::aws:policy/AmazonEKSBlockStoragePolicy"
        - "arn:aws:iam::aws:policy/AmazonEKSLoadBalancingPolicy"
        - "arn:aws:iam::aws:policy/AmazonEKSComputePolicy"
      MaxSessionDuration: 3600
      RoleName: !Sub "${AWS::StackName}-cluster-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Action:
              - "sts:AssumeRole"
              - "sts:TagSession"
            Effect: "Allow"
            Principal:
              Service: "eks.amazonaws.com"
  VdcClusterNodegroupRole:
    Type: "AWS::IAM::Role"
    Properties:
      Path: "/"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy"
        - "arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy"
        - "arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly"
        - "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"
      MaxSessionDuration: 3600
      RoleName: !Sub "${AWS::StackName}-node-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Action: "sts:AssumeRole"
            Effect: "Allow"
            Principal:
              Service: "ec2.amazonaws.com"
  VdcCluster:
    Type: "AWS::EKS::Cluster"
    Properties:
      Logging:
        ClusterLogging:
          EnabledTypes: []
      ComputeConfig:
        Enabled: false
      StorageConfig:
        BlockStorage:
          Enabled: false
      DeletionProtection: false
      ZonalShiftConfig:
        Enabled: false
      AccessConfig:
        AuthenticationMode: "API_AND_CONFIG_MAP"
      EncryptionConfig: []
      KubernetesNetworkConfig:
        ServiceIpv4Cidr: !Ref ClusterServiceCidrBlock
        ElasticLoadBalancing:
          Enabled: false
        IpFamily: "ipv4"
      RoleArn: !GetAtt VdcClusterRole.Arn
      Name: "vdc"
      UpgradePolicy:
        SupportType: "STANDARD"
      Version: "1.35"
      ResourcesVpcConfig:
        EndpointPublicAccess: true
        PublicAccessCidrs: !Ref PublicAccessIpList
        SecurityGroupIds: []
        SubnetIds:
          - !Ref VdcSubnetA
          - !Ref VdcSubnetB
          - !Ref VdcSubnetC
        EndpointPrivateAccess: true
      Tags:
        - Value: "true"
          Key: "alpha.eksctl.io/cluster-oidc-enabled"
  VdcClusterNodeAccessEntry:
    Type: "AWS::EKS::AccessEntry"
    Properties:
      ClusterName: !Ref VdcCluster
      Type: "EC2_LINUX"
      PrincipalArn: !GetAtt VdcClusterNodegroupRole.Arn
  VdcClusterOidcProvider:
    Type: "AWS::IAM::OIDCProvider"
    Properties:
      ClientIdList:
        - "sts.amazonaws.com"
      Url: !GetAtt VdcCluster.OpenIdConnectIssuerUrl

  VdcVpc:
    Type: "AWS::EC2::VPC"
    Properties:
      CidrBlock: !Ref VpcCidrBlock
      EnableDnsSupport: true
      EnableDnsHostnames: true
  VdcSubnetA:
    Type: "AWS::EC2::Subnet"
    Properties:
      MapPublicIpOnLaunch: false
      EnableDns64: false
      VpcId: !Ref VdcVpc
      PrivateDnsNameOptionsOnLaunch:
        EnableResourceNameDnsARecord: false
        HostnameType: "ip-name"
        EnableResourceNameDnsAAAARecord: false
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref SubnetCidrBlockA
      Ipv6Native: false
      Tags:
        - Key: "kubernetes.io/cluster/vdc"
          Value: "shared"
        - Key: "kubernetes.io/role/internal-elb"
          Value: "1"
        - Key: "hail-batch-worker"
          Value: "true"
  VdcSubnetB:
    Type: "AWS::EC2::Subnet"
    Properties:
      MapPublicIpOnLaunch: false
      EnableDns64: false
      VpcId: !Ref VdcVpc
      PrivateDnsNameOptionsOnLaunch:
        EnableResourceNameDnsARecord: false
        HostnameType: "ip-name"
        EnableResourceNameDnsAAAARecord: false
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Ref SubnetCidrBlockB
      Ipv6Native: false
      Tags:
        - Key: "kubernetes.io/cluster/vdc"
          Value: "shared"
        - Key: "kubernetes.io/role/internal-elb"
          Value: "1"
        - Key: "hail-batch-worker"
          Value: "true"
  VdcSubnetC:
    Type: "AWS::EC2::Subnet"
    Properties:
      MapPublicIpOnLaunch: false
      EnableDns64: false
      VpcId: !Ref VdcVpc
      PrivateDnsNameOptionsOnLaunch:
        EnableResourceNameDnsARecord: false
        HostnameType: "ip-name"
        EnableResourceNameDnsAAAARecord: false
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !Ref SubnetCidrBlockC
      Ipv6Native: false
      Tags:
        - Key: "kubernetes.io/cluster/vdc"
          Value: "shared"
        - Key: "kubernetes.io/role/internal-elb"
          Value: "1"
        - Key: "hail-batch-worker"
          Value: "true"
  VdcPublicSubnetA:
    Type: "AWS::EC2::Subnet"
    Properties:
      MapPublicIpOnLaunch: false
      VpcId: !Ref VdcVpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PublicSubnetCidrBlockA
      Tags:
        - Key: "kubernetes.io/cluster/vdc"
          Value: "shared"
        - Key: "kubernetes.io/role/elb"
          Value: "1"
  VdcPublicSubnetB:
    Type: "AWS::EC2::Subnet"
    Properties:
      MapPublicIpOnLaunch: false
      VpcId: !Ref VdcVpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Ref PublicSubnetCidrBlockB
      Tags:
        - Key: "kubernetes.io/cluster/vdc"
          Value: "shared"
        - Key: "kubernetes.io/role/elb"
          Value: "1"
  VdcPublicSubnetC:
    Type: "AWS::EC2::Subnet"
    Properties:
      MapPublicIpOnLaunch: false
      VpcId: !Ref VdcVpc
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !Ref PublicSubnetCidrBlockC
      Tags:
        - Key: "kubernetes.io/cluster/vdc"
          Value: "shared"
        - Key: "kubernetes.io/role/elb"
          Value: "1"
  VdcInternetGateway:
    Type: "AWS::EC2::InternetGateway"
  VdcInternetGatewayAttachment:
    Type: "AWS::EC2::VPCGatewayAttachment"
    Properties:
      VpcId: !Ref VdcVpc
      InternetGatewayId: !Ref VdcInternetGateway
  VdcPublicRouteTable:
    Type: "AWS::EC2::RouteTable"
    Properties:
      VpcId: !Ref VdcVpc
  VdcPublicInternetAccessRoute:
    Type: "AWS::EC2::Route"
    DependsOn: VdcInternetGatewayAttachment
    Properties:
      RouteTableId: !Ref VdcPublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref VdcInternetGateway
  VdcPublicSubnetARouteTableAssociation:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      RouteTableId: !Ref VdcPublicRouteTable
      SubnetId: !Ref VdcPublicSubnetA
  VdcPublicSubnetBRouteTableAssociation:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      RouteTableId: !Ref VdcPublicRouteTable
      SubnetId: !Ref VdcPublicSubnetB
  VdcPublicSubnetCRouteTableAssociation:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      RouteTableId: !Ref VdcPublicRouteTable
      SubnetId: !Ref VdcPublicSubnetC

  VdcOutboundNat:
    Type: "AWS::EC2::NatGateway"
    DependsOn: VdcInternetGatewayAttachment
    Properties:
      AvailabilityMode: "regional"
      ConnectivityType: "public"
      VpcId: !Ref VdcVpc
      Tags:
        - Key: "Name"
          Value: !Sub "outbound-nat-${AWS::Region}"
  VdcRouteTable:
    Type: "AWS::EC2::RouteTable"
    Properties:
      VpcId: !Ref VdcVpc
  VdcInternetAccessRoute:
    Type: "AWS::EC2::Route"
    Properties:
      RouteTableId: !Ref VdcRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref VdcOutboundNat
  VdcSubnetARouteTableAssociation:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      RouteTableId: !Ref VdcRouteTable
      SubnetId: !Ref VdcSubnetA
  VdcSubnetBRouteTableAssociation:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      RouteTableId: !Ref VdcRouteTable
      SubnetId: !Ref VdcSubnetB
  VdcSubnetCRouteTableAssociation:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      RouteTableId: !Ref VdcRouteTable
      SubnetId: !Ref VdcSubnetC
  VdcS3GatewayEndpoint:
    Type: "AWS::EC2::VPCEndpoint"
    Properties:
      VpcEndpointType: "Gateway"
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcId: !Ref VdcVpc
      RouteTableIds:
        - !Ref VdcRouteTable

  # Load balancers for gateway and internal gateway services

  VdcInternalGatewayLoadBalancer:
    Type: "AWS::ElasticLoadBalancingV2::LoadBalancer"
    Properties:
      Name: "internal-gateway"
      Type: "network"
      Scheme: "internal"
      IpAddressType: "ipv4"
      Subnets:
        - !Ref VdcSubnetA
        - !Ref VdcSubnetB
        - !Ref VdcSubnetC
      SecurityGroups:
        - !Ref VdcInternalGatewayLoadBalancerSecurityGroup
      LoadBalancerAttributes:
        - Key: "load_balancing.cross_zone.enabled"
          Value: "true"
  VdcInternalGatewayLoadBalancerSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupName: "internal-gateway"
      GroupDescription: "Security group for the internal gateway load balancer"
      VpcId: !Ref VdcVpc
      SecurityGroupIngress:
        - Description: "Allows HTTP from within the VPC"
          IpProtocol: "tcp"
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref VpcCidrBlock
  VdcInternalGatewayHttpTargetIngress:
    Type: "AWS::EC2::SecurityGroupIngress"
    Properties:
      Description: "Allows the internal gateway load balancer to reach internal-gateway pods over HTTP"
      GroupId: !GetAtt VdcCluster.ClusterSecurityGroupId
      IpProtocol: "tcp"
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref VdcInternalGatewayLoadBalancerSecurityGroup
  VdcInternalGatewayHttpTargetGroup:
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Properties:
      Name: "internal-gateway-http"
      Protocol: "TCP"
      Port: 8080
      TargetType: "ip"
      VpcId: !Ref VdcVpc
      HealthCheckProtocol: "TCP"
  VdcInternalGatewayHttpListener:
    Type: "AWS::ElasticLoadBalancingV2::Listener"
    Properties:
      LoadBalancerArn: !Ref VdcInternalGatewayLoadBalancer
      Protocol: "TCP"
      Port: 80
      DefaultActions:
        - Type: "forward"
          TargetGroupArn: !Ref VdcInternalGatewayHttpTargetGroup

  VdcGatewayLoadBalancer:
    Type: "AWS::ElasticLoadBalancingV2::LoadBalancer"
    DependsOn: VdcPublicInternetAccessRoute
    Properties:
      Name: "gateway"
      Type: "network"
      Scheme: "internet-facing"
      IpAddressType: "ipv4"
      Subnets:
        - !Ref VdcPublicSubnetA
        - !Ref VdcPublicSubnetB
        - !Ref VdcPublicSubnetC
      SecurityGroups:
        - !Ref VdcGatewayLoadBalancerSecurityGroup
      LoadBalancerAttributes:
        - Key: "load_balancing.cross_zone.enabled"
          Value: "false"
  VdcGatewayLoadBalancerSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupName: "gateway"
      GroupDescription: "Security group for the gateway load balancer"
      VpcId: !Ref VdcVpc
      SecurityGroupIngress:
        - Description: "Allows HTTP from the internet"
          IpProtocol: "tcp"
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"
        - Description: "Allows HTTPS from the internet"
          IpProtocol: "tcp"
          FromPort: 443
          ToPort: 443
          CidrIp: "0.0.0.0/0"
  VdcGatewayBootstrapHttpTargetIngress:
    Type: "AWS::EC2::SecurityGroupIngress"
    Properties:
      Description: "Allows the gateway load balancer to reach bootstrap gateway pods over HTTP"
      GroupId: !GetAtt VdcCluster.ClusterSecurityGroupId
      IpProtocol: "tcp"
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !Ref VdcGatewayLoadBalancerSecurityGroup
  VdcGatewayBootstrapHttpsTargetIngress:
    Type: "AWS::EC2::SecurityGroupIngress"
    Properties:
      Description: "Allows the gateway load balancer to reach bootstrap gateway pods over HTTPS"
      GroupId: !GetAtt VdcCluster.ClusterSecurityGroupId
      IpProtocol: "tcp"
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref VdcGatewayLoadBalancerSecurityGroup
  VdcGatewayHttpTargetIngress:
    Type: "AWS::EC2::SecurityGroupIngress"
    Properties:
      Description: "Allows the gateway load balancer to reach gateway pods over HTTP"
      GroupId: !GetAtt VdcCluster.ClusterSecurityGroupId
      IpProtocol: "tcp"
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref VdcGatewayLoadBalancerSecurityGroup
  VdcGatewayHttpsTargetIngress:
    Type: "AWS::EC2::SecurityGroupIngress"
    Properties:
      Description: "Allows the gateway load balancer to reach gateway pods over HTTPS"
      GroupId: !GetAtt VdcCluster.ClusterSecurityGroupId
      IpProtocol: "tcp"
      FromPort: 8443
      ToPort: 8443
      SourceSecurityGroupId: !Ref VdcGatewayLoadBalancerSecurityGroup
  VdcGatewayHttpTargetGroup:
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Properties:
      Name: "gateway-http"
      Protocol: "TCP"
      Port: 8080
      TargetType: "ip"
      VpcId: !Ref VdcVpc
      HealthCheckProtocol: "TCP"
  VdcGatewayHttpsTargetGroup:
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Properties:
      Name: "gateway-https"
      Protocol: "TCP"
      Port: 8443
      TargetType: "ip"
      VpcId: !Ref VdcVpc
      HealthCheckProtocol: "TCP"
  VdcGatewayHttpListener:
    Type: "AWS::ElasticLoadBalancingV2::Listener"
    Properties:
      LoadBalancerArn: !Ref VdcGatewayLoadBalancer
      Protocol: "TCP"
      Port: 80
      DefaultActions:
        - Type: "forward"
          TargetGroupArn: !Ref VdcGatewayHttpTargetGroup
  VdcGatewayHttpsListener:
    Type: "AWS::ElasticLoadBalancingV2::Listener"
    Properties:
      LoadBalancerArn: !Ref VdcGatewayLoadBalancer
      Protocol: "TCP"
      Port: 443
      DefaultActions:
        - Type: "forward"
          TargetGroupArn: !Ref VdcGatewayHttpsTargetGroup

  VdcArtifactRepositoryTemplate:
    Type: "AWS::ECR::RepositoryCreationTemplate"
    Properties:
      AppliedFor:
        - "CREATE_ON_PUSH"
      EncryptionConfiguration:
        EncryptionType: "AES256"
      Prefix: "hail"
  VdcDockerhubProxyRepositoryTemplate:
    Type: "AWS::ECR::RepositoryCreationTemplate"
    Properties:
      AppliedFor:
        - "CREATE_ON_PUSH"
      EncryptionConfiguration:
        EncryptionType: "AES256"
      LifecyclePolicy:
        Fn::ToJsonString:
          rules:
            - rulePriority: 1
              description: "Delete after 1d"
              selection:
                tagStatus: "any"
                countType: "sinceImagePushed"
                countUnit: "days"
                countNumber: 1
              action:
                type: "expire"
      Prefix: "dockerhubproxy"

  VdcHailBatchBucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketName: !Sub
        - "hail-batch-${RandomString}"
        - RandomString: !Select [2, !Split ["/", !Ref AWS::StackId]]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: "AES256"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  VdcHailQueryBucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketName: !Sub
        - "hail-query-${RandomString}"
        - RandomString: !Select [2, !Split ["/", !Ref AWS::StackId]]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: "AES256"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  VdcHailTestBucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketName: !Sub
        - "hail-test-${RandomString}"
        - RandomString: !Select [2, !Split ["/", !Ref AWS::StackId]]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: "AES256"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  VdcTestRequesterPaysBucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketName: !Sub
        - "hail-test-requester-pays-${RandomString}"
        - RandomString: !Select [2, !Split ["/", !Ref AWS::StackId]]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: "AES256"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  VdcDb:
    Type: "AWS::RDS::DBInstance"
    Properties:
      AllocatedStorage: 20
      DBInstanceClass: "db.m9g.xlarge"
      DBSubnetGroupName: !Ref VdcDbSubnetGroup
      DBParameterGroupName: !Ref VdcDbParameterGroup
      Engine: "mysql"
      EngineVersion: "8.4.10"
      MasterUsername: "root"
      ManageMasterUserPassword: true
      MasterUserSecret:
        KmsKeyId: !Ref VdcDbMasterPassword
      VPCSecurityGroups:
        - !Ref VdcDbSecurityGroup

  VdcDbSubnetGroup:
    Type: "AWS::RDS::DBSubnetGroup"
    Properties:
      DBSubnetGroupDescription: "Group for VDC network subnets"
      SubnetIds:
        - !Ref VdcSubnetA
        - !Ref VdcSubnetB
        - !Ref VdcSubnetC

  VdcDbParameterGroup:
    Type: "AWS::RDS::DBParameterGroup"
    Properties:
      Description: "Parameter group for MySQL database"
      Family: "mysql8.4"
      Parameters:
        innodb_log_buffer_size: "536870912"
        innodb_redo_log_capacity: "10737418240"
        event_scheduler: "on"
        skip_show_database: "on"
        local_infile: "off"
        log_bin_trust_function_creators: "1"
        sql_mode: "ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"

  VdcDbSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      VpcId: !ImportValue VdcNetwork
      GroupDescription: "Security group for MySQL database"
      SecurityGroupIngress:
        - Description: "Allows MySQL access from cluster"
          IpProtocol: "tcp"
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !GetAtt VdcCluster.ClusterSecurityGroupId

  VdcDbMasterPassword:
    Type: "AWS::KMS::Key"
    Properties:
      Description: "Root password for MySQL database"
      EnableKeyRotation: false
      KeyPolicy:
        Version: "2012-10-17"
        Id: !Ref AWS::StackName
        Statement:
          - Effect: "Allow"
            Principal:
              AWS:
                Fn::Sub: 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action:
              - "kms:*"
            Resource: "*"


  # AWS-managed EKS addons & necessary roles

  VdcClusterAddonEbsCsiDriver:
    Type: "AWS::EKS::Addon"
    DependsOn: VdcClusterAddonPodIdentityAgent
    Properties:
      NamespaceConfig:
        Namespace: "kube-system"
      PodIdentityAssociations:
        - ServiceAccount: "ebs-csi-controller-sa"
          RoleArn: !GetAtt VdcClusterCsiDriverRole.Arn
      ClusterName: !Ref VdcCluster
      AddonName: "aws-ebs-csi-driver"
  VdcClusterAddonCloudWatchAgent:
    Type: "AWS::EKS::Addon"
    DependsOn: VdcClusterAddonPodIdentityAgent
    Properties:
      NamespaceConfig:
        Namespace: "amazon-cloudwatch"
      PodIdentityAssociations:
        - ServiceAccount: "cloudwatch-agent"
          RoleArn: !GetAtt VdcClusterCloudWatchObservabilityRole.Arn
      ClusterName: !Ref VdcCluster
      AddonName: "amazon-cloudwatch-observability"
  VdcClusterAddonNodeMonitoringAgent:
    Type: "AWS::EKS::Addon"
    Properties:
      NamespaceConfig:
        Namespace: "kube-system"
      ClusterName: !Ref VdcCluster
      AddonName: "eks-node-monitoring-agent"
  VdcClusterAddonKubeProxy:
    Type: "AWS::EKS::Addon"
    Properties:
      NamespaceConfig:
        Namespace: "kube-system"
      ClusterName: !Ref VdcCluster
      AddonName: "kube-proxy"
  VdcClusterAddonExternalDns:
    Type: "AWS::EKS::Addon"
    Properties:
      NamespaceConfig:
        Namespace: "external-dns"
      ClusterName: !Ref VdcCluster
      AddonName: "external-dns"
  VdcClusterAddonCoreDns:
    Type: "AWS::EKS::Addon"
    Properties:
      NamespaceConfig:
        Namespace: "kube-system"
      ClusterName: !Ref VdcCluster
      AddonName: "coredns"
  VdcClusterAddonVpcCni:
    Type: "AWS::EKS::Addon"
    DependsOn: [ VdcPreemptibleNodeGroup, VdcNonpreemptibleNodeGroup ]
    Properties:
      NamespaceConfig:
        Namespace: "kube-system"
      ServiceAccountRoleArn: !GetAtt VdcClusterVpcCniRole.Arn
      ConfigurationValues:
        Fn::ToJsonString:
          env:
            ENABLE_PREFIX_DELEGATION: "true"
            WARM_PREFIX_TARGET: "1"
      ClusterName: !Ref VdcCluster
      AddonName: "vpc-cni"
  VdcClusterAddonPodIdentityAgent:
    Type: "AWS::EKS::Addon"
    Properties:
      NamespaceConfig:
        Namespace: "kube-system"
      ClusterName: !Ref VdcCluster
      AddonName: "eks-pod-identity-agent"
  VdcClusterAddonMetricsServer:
    Type: "AWS::EKS::Addon"
    Properties:
      NamespaceConfig:
        Namespace: "kube-system"
      ClusterName: !Ref VdcCluster
      AddonName: "metrics-server"

  VdcClusterCsiDriverRole:
    Type: "AWS::IAM::Role"
    Properties:
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AmazonEBSCSIDriverPolicyV2"
      MaxSessionDuration: 3600
      RoleName: !Sub "${AWS::StackName}-csi-driver-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Action:
              - "sts:AssumeRole"
              - "sts:TagSession"
            Effect: "Allow"
            Principal:
              Service: "pods.eks.amazonaws.com"
  VdcClusterCloudWatchObservabilityRole:
    Type: "AWS::IAM::Role"
    Properties:
      Path: "/"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy"
      MaxSessionDuration: 3600
      RoleName: !Sub "${AWS::StackName}-cloudwatch-observability-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Action:
              - "sts:AssumeRole"
              - "sts:TagSession"
            Effect: "Allow"
            Principal:
              Service: "pods.eks.amazonaws.com"
  VdcClusterVpcCniRole:
    Type: "AWS::IAM::Role"
    DependsOn: VdcClusterOidcProvider
    Properties:
      Path: "/"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy"
      MaxSessionDuration: 3600
      RoleName: !Sub "${AWS::StackName}-vpc-cni-role"
      AssumeRolePolicyDocument: !Sub
        - |
          {
            "Version": "2012-10-17",
            "Statement": {
              "Condition": {
                "StringEquals": {
                  "${OidcPrefix}:aud": "sts.amazonaws.com",
                  "${OidcPrefix}:sub": "system:serviceaccount:kube-system:aws-node"
                }
              },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Effect": "Allow",
              "Principal": {
                "Federated": "arn:aws:iam::${AWS::AccountId}:oidc-provider/${OidcPrefix}"
              }
            }
          }
        - OidcPrefix: !Select [1, !Split ["//", !GetAtt VdcCluster.OpenIdConnectIssuerUrl]]
  VdcExternalSecretsRole:
    Type: "AWS::IAM::Role"
    DependsOn: VdcClusterOidcProvider
    Properties:
      Path: "/"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/SecretsManagerReadWrite"
      MaxSessionDuration: 3600
      RoleName: !Sub "${AWS::StackName}-external-secrets-role"
      AssumeRolePolicyDocument: !Sub
        - |
          {
            "Version": "2012-10-17",
            "Statement": {
              "Condition": {
                "StringEquals": {
                  "${OidcPrefix}:aud": "sts.amazonaws.com",
                  "${OidcPrefix}:sub": "system:serviceaccount:external-secrets:external-secrets"
                }
              },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Effect": "Allow",
              "Principal": {
                "Federated": "arn:aws:iam::${AWS::AccountId}:oidc-provider/${OidcPrefix}"
              }
            }
          }
        - OidcPrefix: !Select [1, !Split ["//", !GetAtt VdcCluster.OpenIdConnectIssuerUrl]]
  VdcLoadBalancerControllerRole:
    Type: "AWS::IAM::Role"
    DependsOn: VdcClusterOidcProvider
    Properties:
      Path: "/"
      MaxSessionDuration: 3600
      RoleName: !Sub "${AWS::StackName}-load-balancer-controller-role"
      AssumeRolePolicyDocument: !Sub
        - |
          {
            "Version": "2012-10-17",
            "Statement": {
              "Condition": {
                "StringEquals": {
                  "${OidcPrefix}:aud": "sts.amazonaws.com",
                  "${OidcPrefix}:sub": "system:serviceaccount:kube-system:aws-load-balancer-controller"
                }
              },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Effect": "Allow",
              "Principal": {
                "Federated": "arn:aws:iam::${AWS::AccountId}:oidc-provider/${OidcPrefix}"
              }
            }
          }
        - OidcPrefix: !Select [1, !Split ["//", !GetAtt VdcCluster.OpenIdConnectIssuerUrl]]

Outputs:
  VdcClusterName:
    Value: !Ref VdcCluster
    Description: "EKS cluster name"
    Export:
      Name: VdcClusterName
  VdcClusterSecurityGroup:
    Value: !GetAtt VdcCluster.ClusterSecurityGroupId
    Description: "EKS cluster security group"
    Export:
      Name: VdcClusterSecurityGroup
  VdcNetwork:
    Value: !Ref VdcVpc
    Description: "Cluster network VPC"
    Export:
      Name: VdcNetwork
  VdcSubnet:
    Value: !Ref VdcSubnetA
    Description: "Subnet belonging to cluster VPC"
    Export:
      Name: VdcSubnet
  VdcExternalSecretsRoleArn:
    Value: !GetAtt VdcExternalSecretsRole.Arn
    Description: "ARN of the role used by the external-secrets addon for EKS"
    Export:
      Name: VdcExternalSecretsRoleArn
  VdcLoadBalancerControllerRoleName:
    Value: !Ref VdcLoadBalancerControllerRole
    Description: "Name of the role used by the AWS Load Balancer Controller for EKS"
    Export:
      Name: VdcLoadBalancerControllerRoleName
  VdcNodeRole:
    Value: !GetAtt VdcClusterNodegroupRole.Arn
    Description: "ARN of IAM role associated with cluster nodes"
    Export:
      Name: VdcNodeRole
  VdcDbSecurityGroup:
    Value: !GetAtt VdcDbSecurityGroup.GroupId
    Description: "RDS MySQL database security group"
    Export:
      Name: VdcDbSecurityGroup
