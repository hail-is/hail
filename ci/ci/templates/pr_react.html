{% extends "layout.html" %}
{% block title %}PR #{{ pr_number }}{% endblock %}
{% block head %}
<script type="module" src="{{ base_path }}/ci/static/compiled-js/pr.js"></script>
{% endblock %}
{% block content %}
<div id="pr-details-root"
     data-base-path="{{ base_path }}"
     data-batch-base-url="{{ batch_base_url }}"
     data-watched-branch-index="{{ watched_branch_index }}"
     data-pr-number="{{ pr_number }}">
  <div class="flex items-center justify-center mt-24">
    <span class="text-5xl font-light text-sky-600">Loading&hellip;</span>
  </div>
</div>
{% endblock %}
