{% extends "layout.html" %}
{% block title %}Batch {{ batch_id }} Job {{ job_id }} JVM Profile{% endblock %}
{% block head %}
<style>
  html, body { height: 100%; }
  #main { min-height: 100%; display: flex; flex-direction: column; }
  #content { flex: 1; display: flex; flex-direction: column; }
</style>
{% endblock %}
{% block content %}
<nav class="flex items-center gap-2 text-xl font-light text-zinc-500 mb-4 shrink-0">
  <a href="{{ base_path }}/batches" class="hover:text-sky-600">Batches</a>
  <span class="text-zinc-300">›</span>
  <a href="{{ base_path }}/batches/{{ batch_id }}" class="hover:text-sky-600">Batch {{ batch_id }}</a>
  <span class="text-zinc-300">›</span>
  <a href="{{ base_path }}/batches/{{ batch_id }}/jobs/{{ job_id }}" class="hover:text-sky-600">Job {{ job_id }}</a>
  <span class="text-zinc-300">›</span>
  <span class="text-zinc-800">JVM Profile</span>
</nav>
<iframe
  src="{{ base_path }}/batches/{{ batch_id }}/jobs/{{ job_id }}/jvm_profile"
  sandbox="allow-scripts"
  class="w-full border border-zinc-300 rounded"
  style="flex: 1;"
></iframe>
{% endblock %}
