apiVersion: v1
kind: Service
metadata:
  name: letsencrypt
  labels:
    app: letsencrypt
    hail.is/sha: "{{ code.sha }}"
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: letsencrypt
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 80
  - name: https
    port: 443
    protocol: TCP
    targetPort: 443
  selector:
    app: gateway
{% if global.cloud == "aws" %}
  # configured in infra/aws/main.yaml
  type: ClusterIP
{% else %}
  loadBalancerIP: "{{ global.ip }}"
  # https://kubernetes.io/docs/tutorials/services/source-ip/#source-ip-for-services-with-type-loadbalancer
  externalTrafficPolicy: Local
  type: LoadBalancer
{% endif %}
